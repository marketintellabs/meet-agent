services:
  meet-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      # LLM — any OpenAI-compatible endpoint
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-nvidia/Nemotron-Mini-4B-Instruct}

      # STT
      - STT_PROVIDER=${STT_PROVIDER:-deepinfra}
      - STT_API_KEY=${STT_API_KEY:-${LLM_API_KEY}}
      - STT_MODEL=${STT_MODEL:-openai/whisper-large-v3-turbo}

      # TTS
      - TTS_PROVIDER=${TTS_PROVIDER:-openai}
      - TTS_API_KEY=${TTS_API_KEY}
      - TTS_VOICE=${TTS_VOICE:-alloy}

      # Agent
      - AGENT_NAME=${AGENT_NAME:-MeetAgent}
      - AGENT_SYSTEM_PROMPT=${AGENT_SYSTEM_PROMPT:-You are a helpful AI meeting assistant.}
    # Chromium needs shared memory
    shm_size: "2gb"
    restart: unless-stopped
