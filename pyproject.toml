[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meet-agent"
version = "0.1.0"
description = "Open-source AI agents for video meetings. Google Meet. Zoom. Your LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "MarketIntelLabs", email = "dev@marketintellabs.com" }]
keywords = ["ai", "meeting", "agent", "google-meet", "zoom", "voice", "avatar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Conferencing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "playwright>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "numpy>=1.26",
    "soundfile>=0.12",
    "click>=8.1",
    "rich>=13.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
stt-local = ["faster-whisper>=1.0"]
tts-local = ["piper-tts>=1.2"]
vad = ["silero-vad>=5.1", "torch>=2.1"]
all-local = ["meet-agent[stt-local,tts-local,vad]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
meet-agent = "meet_agent.cli:main"

[project.urls]
Homepage = "https://github.com/MarketIntelLabs/meet-agent"
Repository = "https://github.com/MarketIntelLabs/meet-agent"
Issues = "https://github.com/MarketIntelLabs/meet-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/meet_agent"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
